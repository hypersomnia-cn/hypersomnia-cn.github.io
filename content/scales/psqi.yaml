contentVersion: 1.1.0
scoringVersion: 1.0.0
disclaimer:
  zh: 自评结果仅供理解症状和就诊沟通参考，不能单独确诊或排除特发性嗜睡症及其他疾病。
  en: Self-assessment supports understanding and clinical discussion. It cannot diagnose or rule out idiopathic hypersomnia or other conditions.
id: psqi
itemCount: 19
abbreviation: PSQI
title:
  zh: 匹兹堡睡眠质量指数
  en: Pittsburgh Sleep Quality Index
description:
  zh: 评估过去一个月的睡眠质量，包含主观睡眠质量、入睡时间、睡眠时长、睡眠效率、睡眠障碍、助眠药物使用及日间功能七个组成部分。
  en: 'Assesses sleep quality over the past month across seven components: subjective sleep quality, latency, duration, efficiency, disturbances, sleep medication and daytime dysfunction.'
instructions:
  zh: 请按过去一个月大多数日夜的通常情况作答。上床时间和起床时间采用 24 小时制，睡眠时长填写实际睡着的时间。
  en: Answer for a typical day and night in the past month. Use 24-hour times and report actual sleep duration.
recall:
  zh: 过去一个月
  en: Past month
duration:
  zh: 约 5–10 分钟
  en: About 5–10 minutes
sourceVersion: PSQI English AU1.4; 1989/2010; scoring amendment 2005
calculator: psqi
range:
  - 0
  - 21
scoreLabel:
  zh: 总分
  en: Total score
interpretationNote:
  zh: 总分越高表示报告的睡眠质量越差。采用原版 >5 的参考阈值；不以语言切换改变阈值。
  en: Higher scores indicate poorer reported sleep quality. The original >5 reference threshold is used in both languages.
sources:
  - title:
      zh: 匹兹堡大学：PSQI
      en: 'University of Pittsburgh: PSQI'
    url: https://www.sleep.pitt.edu/psqi
  - title:
      zh: PSQI 原版量表
      en: PSQI original instrument
    url: https://www.sleep.pitt.edu/sites/default/files/assets/Instrument%20Materials/PSQI_AU1.4_eng-USori.pdf
  - title:
      zh: PSQI 计分说明
      en: PSQI scoring guidance
    url: https://biolincc.nhlbi.nih.gov/media/studies/masm/PSQI%20Scoring.pdf
components:
  quality:
    zh: 主观睡眠质量
    en: Subjective sleep quality
  latency:
    zh: 入睡时间
    en: Sleep latency
  duration:
    zh: 睡眠时长
    en: Sleep duration
  efficiency:
    zh: 习惯性睡眠效率
    en: Habitual sleep efficiency
  disturbance:
    zh: 睡眠障碍
    en: Sleep disturbances
  medication:
    zh: 助眠药物使用
    en: Sleep medication
  daytime:
    zh: 日间功能障碍
    en: Daytime dysfunction
sections:
  - id: schedule
    title:
      zh: 01 · 睡眠时间
      en: 01 · Sleep schedule
    questions:
      - id: q1
        label:
          zh: 1. 您通常几点上床？
          en: 1. Usual bedtime?
        type: time
        required: true
      - id: q2
        label:
          zh: 2. 通常需要多少分钟才能入睡？
          en: 2. Usual minutes to fall asleep?
        type: number
        required: true
        min: 0
        max: 1440
        step: 1
      - id: q3
        label:
          zh: 3. 您通常几点起床？
          en: 3. Usual rising time?
        type: time
        required: true
      - id: q4
        label:
          zh: 4. 每晚实际睡着多少小时？
          en: 4. Actual hours of sleep per night?
        type: number
        required: true
        min: 0
        max: 24
        step: 0.01
        help:
          zh: 可填写小数，例如 7.5。睡着时间通常少于卧床时间。
          en: Decimals are allowed, e.g. 7.5. Sleep duration usually differs from time in bed.
  - id: disturbances
    title:
      zh: 02 · 影响睡眠的情况
      en: 02 · Sleep disturbances
    questions:
      - id: q5a
        label:
          zh: 5a. 30 分钟内不能入睡
          en: 5a. Taking over 30 minutes to fall asleep
        type: choice
        required: true
        options: &a1
          - id: '0'
            label:
              zh: 过去一个月没有
              en: Not in the past month
            score: 0
          - id: '1'
            label:
              zh: 每周少于一次
              en: Less than weekly
            score: 1
          - id: '2'
            label:
              zh: 每周一至两次
              en: Once or twice weekly
            score: 2
          - id: '3'
            label:
              zh: 每周三次或以上
              en: Three or more times weekly
            score: 3
      - id: q5b
        label:
          zh: 5b. 半夜或清晨醒来
          en: 5b. Waking during the night or early morning
        type: choice
        required: true
        options: *a1
      - id: q5c
        label:
          zh: 5c. 需要起床上厕所
          en: 5c. Getting up to use the bathroom
        type: choice
        required: true
        options: *a1
      - id: q5d
        label:
          zh: 5d. 呼吸不顺畅
          en: 5d. Breathing discomfort
        type: choice
        required: true
        options: *a1
      - id: q5e
        label:
          zh: 5e. 咳嗽或大声打鼾
          en: 5e. Coughing or loud snoring
        type: choice
        required: true
        options: *a1
      - id: q5f
        label:
          zh: 5f. 感觉太冷
          en: 5f. Feeling too cold
        type: choice
        required: true
        options: *a1
      - id: q5g
        label:
          zh: 5g. 感觉太热
          en: 5g. Feeling too hot
        type: choice
        required: true
        options: *a1
      - id: q5h
        label:
          zh: 5h. 做噩梦
          en: 5h. Bad dreams
        type: choice
        required: true
        options: *a1
      - id: q5i
        label:
          zh: 5i. 疼痛
          en: 5i. Pain
        type: choice
        required: true
        options: *a1
      - id: q5j_text
        label:
          zh: 5j. 其他影响睡眠的原因（如有）
          en: 5j. Other reason disturbing sleep, if any
        type: text
        required: false
        scored: false
      - id: q5j
        label:
          zh: 5j. 上述其他原因发生的频率
          en: 5j. Frequency of that other reason
        type: choice
        required: false
        options: *a1
    description:
      zh: 过去一个月，以下情况使您睡不好的频率是？其他原因未填写时，按原计分规则记为 0。
      en: How often did each issue disturb sleep in the past month? An unspecified other reason contributes zero under the scoring rules.
  - id: quality
    title:
      zh: 03 · 睡眠质量与白天状态
      en: 03 · Sleep quality and daytime functioning
    questions:
      - id: q6
        label:
          zh: 6. 您如何评价整体睡眠质量？
          en: 6. Overall sleep quality?
        type: choice
        required: true
        options:
          - id: '0'
            label:
              zh: 很好
              en: Very good
            score: 0
          - id: '1'
            label:
              zh: 较好
              en: Fairly good
            score: 1
          - id: '2'
            label:
              zh: 较差
              en: Fairly bad
            score: 2
          - id: '3'
            label:
              zh: 很差
              en: Very bad
            score: 3
      - id: q7
        label:
          zh: 7. 使用助眠药物的频率（处方或非处方）？
          en: 7. Frequency of using prescribed or nonprescribed sleep medicine?
        type: choice
        required: true
        options: *a1
      - id: q8
        label:
          zh: 8. 驾驶、吃饭或社交时难以保持清醒的频率？
          en: 8. Trouble staying awake during driving, meals or social activity?
        type: choice
        required: true
        options: *a1
      - id: q9
        label:
          zh: 9. 保持足够的热情完成事情有多困难？
          en: 9. Difficulty maintaining enthusiasm to get things done?
        type: choice
        required: true
        options:
          - id: '0'
            label:
              zh: 没有困难
              en: No difficulty
            score: 0
          - id: '1'
            label:
              zh: 轻微困难
              en: Slight difficulty
            score: 1
          - id: '2'
            label:
              zh: 有一些困难
              en: Some difficulty
            score: 2
          - id: '3'
            label:
              zh: 很大困难
              en: Major difficulty
            score: 3
  - id: partner
    title:
      zh: 04 · 同住者观察（可选）
      en: 04 · Partner observations (optional)
    questions:
      - id: q10
        label:
          zh: 10. 您有同床者或室友吗？
          en: 10. Your sleeping arrangement?
        type: choice
        required: false
        options:
          - id: '0'
            label:
              zh: 没有同床者或室友
              en: No partner or roommate
            score: 0
          - id: '1'
            label:
              zh: 同住者在其他房间
              en: Separate room
            score: 1
          - id: '2'
            label:
              zh: 同一房间但不同床
              en: Same room, separate bed
            score: 2
          - id: '3'
            label:
              zh: 同一张床
              en: Same bed
            score: 3
        scored: false
      - id: q10a
        label:
          zh: 10a. 大声打鼾
          en: 10a. Loud snoring
        type: choice
        required: false
        options: *a1
        scored: false
      - id: q10b
        label:
          zh: 10b. 睡眠中呼吸长时间暂停
          en: 10b. Long breathing pauses
        type: choice
        required: false
        options: *a1
        scored: false
      - id: q10c
        label:
          zh: 10c. 睡眠中腿部抽动
          en: 10c. Leg twitching
        type: choice
        required: false
        options: *a1
        scored: false
      - id: q10d
        label:
          zh: 10d. 睡眠中迷失方向或意识混乱
          en: 10d. Disorientation or confusion during sleep
        type: choice
        required: false
        options: *a1
        scored: false
      - id: q10e
        label:
          zh: 10e. 其他睡眠不安情况
          en: 10e. Other restlessness
        type: choice
        required: false
        options: *a1
        scored: false
      - id: q10e_text
        label:
          zh: 其他睡眠不安情况的说明
          en: Details of other restlessness
        type: text
        required: false
        scored: false
    description:
      zh: 如有同住者，请由其提供观察。这部分不参与计分，不影响提交。
      en: A partner or roommate may provide these observations. They are not scored and are not required.
bands:
  - id: reference
    min: 0
    max: 5
    title:
      zh: 未超过原版参考阈值
      en: Within the original reference threshold
    explanation:
      zh: 本次得分未超过原版睡眠质量困难的参考阈值。明显症状仍值得与医生讨论。
      en: Your score does not exceed the original reference threshold. Significant symptoms can still merit clinical discussion.
    advice: &a2
      zh: 若症状持续或影响学习、工作及日常生活，建议记录睡眠与症状，并与睡眠医学专业人员讨论。
      en: If symptoms persist or affect daily life, record your sleep and symptoms and discuss them with a sleep clinician.
  - id: poor
    min: 6
    max: 21
    title:
      zh: 提示睡眠质量困难
      en: Suggests sleep quality difficulties
    explanation:
      zh: 本次得分超过原版参考阈值，提示值得进一步了解的睡眠质量问题。
      en: Your score exceeds the original reference threshold and suggests sleep quality difficulties worth exploring.
    advice: *a2
