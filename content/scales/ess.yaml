contentVersion: 1.1.0
scoringVersion: 1.0.0
disclaimer:
  zh: 自评结果仅供理解症状和就诊沟通参考，不能单独确诊或排除特发性嗜睡症及其他疾病。
  en: Self-assessment supports understanding and clinical discussion. It cannot diagnose or rule out idiopathic hypersomnia or other conditions.
id: ess
itemCount: 8
abbreviation: ESS
title:
  zh: Epworth 嗜睡量表
  en: Epworth Sleepiness Scale
description:
  zh: 通过八种日常情境中打瞌睡或入睡的可能性，评估成人日间嗜睡程度。评分反映通常的入睡倾向，区别于主观疲劳感。
  en: Assesses adult daytime sleepiness through the likelihood of dozing in eight everyday situations. Scores reflect usual sleep propensity rather than subjective fatigue.
instructions:
  zh: 请根据近期通常的情况，选择在以下情境中打瞌睡或睡着的可能性，而不是疲劳感。即使近期未经历某种情境，也请估计自己会如何。
  en: Estimate your usual recent likelihood of dozing in each situation, rather than tiredness. For unfamiliar situations, estimate how you would respond.
recall:
  zh: 近期通常情况
  en: Usual recent experience
duration:
  zh: 约 2–3 分钟
  en: About 2–3 minutes
sourceVersion: ESS adult 1997
calculator: sum
range:
  - 0
  - 24
scoreLabel:
  zh: 总分
  en: Total score
interpretationNote:
  zh: 区间依据 ESS 官方成人评分解释。低分不排除睡眠疾病；是否需要评估也取决于症状及生活影响。
  en: Ranges follow official adult ESS guidance. Low scores do not rule out sleep conditions; symptoms and their impact also matter.
sources:
  - title:
      zh: ESS 官方说明
      en: ESS official guidance
    url: https://epworthsleepinessscale.com/about-the-ess/
