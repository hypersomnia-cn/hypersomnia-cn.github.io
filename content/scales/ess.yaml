bands:
  - id: lower
    min: 0
    max: 5
    title:
      zh: 正常范围内较低的日间嗜睡
      en: Lower normal daytime sleepiness
    explanation:
      zh: 本次得分处于成人参考正常范围的较低部分。
      en: Your score is in the lower part of the adult reference range.
    advice: &a1
      zh: 若症状持续或影响学习、工作及日常生活，建议记录睡眠与症状，并与睡眠医学专业人员讨论。
      en: If symptoms persist or affect daily life, record your sleep and symptoms and discuss them with a sleep clinician.
  - id: higher
    min: 6
    max: 10
    title:
      zh: 正常范围内较高的日间嗜睡
      en: Higher normal daytime sleepiness
    explanation:
      zh: 本次得分仍在成人参考正常范围内。若仍有明显症状，可继续寻求评估。
      en: Your score remains within the adult reference range. Troublesome symptoms can still warrant assessment.
    advice: *a1
  - id: mild
    min: 11
    max: 12
    title:
      zh: 轻度日间过度嗜睡
      en: Mild excessive daytime sleepiness
    explanation:
      zh: 本次得分提示日间嗜睡倾向高于参考正常范围。
      en: Your score suggests daytime sleepiness above the reference range.
    advice: *a1
  - id: moderate
    min: 13
    max: 15
    title:
      zh: 中度日间过度嗜睡
      en: Moderate excessive daytime sleepiness
    explanation:
      zh: 本次得分提示较明显的日间嗜睡倾向。
      en: Your score suggests a notable tendency toward daytime sleepiness.
    advice: *a1
  - id: severe
    min: 16
    max: 24
    title:
      zh: 重度日间过度嗜睡
      en: Severe excessive daytime sleepiness
    explanation:
      zh: 本次得分提示较高的日间嗜睡程度，建议与专业人员讨论症状和安全影响。
      en: Your score suggests substantial daytime sleepiness. Discuss symptoms and safety implications with a clinician.
    advice: *a1
