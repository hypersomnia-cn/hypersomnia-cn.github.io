contentVersion: 1.1.0
scoringVersion: 1.0.0
disclaimer:
  zh: 自评结果仅供理解症状和就诊沟通参考，不能单独确诊或排除特发性嗜睡症及其他疾病。
  en: Self-assessment supports understanding and clinical discussion. It cannot diagnose or rule out idiopathic hypersomnia or other conditions.
id: fss
itemCount: 9
totalRange:
  - 9
  - 63
abbreviation: FSS
title:
  zh: 疲劳严重度量表
  en: Fatigue Severity Scale
description:
  zh: 通过九项自我报告，评估过去一周疲劳的严重程度及其对身体活动、工作、家庭和社交生活的影响。结果以平均分表示。
  en: Uses nine self-reported statements to assess fatigue severity over the past week and its impact on physical activity, work, family and social life. Results are reported as a mean score.
instructions:
  zh: 请根据过去一周的情况，评价您对每项陈述的同意程度。1 表示完全不同意，7 表示完全同意，2–6 表示介于两者之间。
  en: For the past week, rate agreement with each statement from 1 (strongly disagree) to 7 (strongly agree), with 2–6 in between.
recall:
  zh: 过去一周
  en: Past week
duration:
  zh: 约 3 分钟
  en: About 3 minutes
sourceVersion: FSS-9, Krupp 1989
calculator: mean
range:
  - 1
  - 7
scoreLabel:
  zh: 平均分
  en: Mean score
interpretationNote:
  zh: 平均分越高，报告的疲劳影响越大。不同疾病和人群的参考阈值不同，本页不作统一的轻中重分级。
  en: Higher means indicate greater reported fatigue impact. Thresholds vary by condition and population, so no universal severity categories are assigned.
sources:
  - title:
      zh: Valko 等：FSS 验证研究
      en: Valko et al., FSS validation
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2579971/
  - title:
      zh: 美国胸科学会：FSS
      en: 'American Thoracic Society: FSS'
    url: https://www.thoracic.org/members/assemblies/assemblies/srn/questionaires/fss.php
