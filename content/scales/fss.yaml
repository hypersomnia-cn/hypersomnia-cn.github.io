bands:
  - id: continuous
    min: 1
    max: 7
    title:
      zh: 疲劳影响的连续评分
      en: Continuous fatigue impact score
    explanation:
      zh: 请结合具体题目和日常功能理解得分；此分数不能判断疲劳的原因。
      en: Consider individual responses and everyday functioning. This score does not determine the cause of fatigue.
    advice:
      zh: 若症状持续或影响学习、工作及日常生活，建议记录睡眠与症状，并与睡眠医学专业人员讨论。
      en: If symptoms persist or affect daily life, record your sleep and symptoms and discuss them with a sleep clinician.
