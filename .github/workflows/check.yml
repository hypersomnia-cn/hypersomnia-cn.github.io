name: Check and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: root
            base_path: ''
          - target: subpath
            base_path: '/webside'
    env:
      NEXT_PUBLIC_BASE_PATH: ${{ matrix.base_path }}
      SITE_ORIGIN: https://example.test
      IH_CONTENT_DIR: ${{ github.workspace }}/.local/content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hypersomnia-cn/hypersomnia-cn.github.io
          ref: ${{ vars.CONTENT_REF || 'main' }}
          path: .local/content
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm validate:static
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: static-site-${{ matrix.target }}
          path: out
